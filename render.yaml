# Ei Void on Render.
#
# One Blueprint deploys:
#   - eivoid-web  : Express website + app/bot API (Docker)
#   - eivoid-bot  : Discord.js worker + reminder scheduler (Docker)
#   - eivoid-db   : PostgreSQL 16
#
# Generated values (SESSION_SECRET, BOT_API_TOKEN, DATABASE_URL) are wired
# automatically. Fill the `sync: false` values in the Render dashboard.

databases:
  - name: eivoid-db
    databaseName: eivoid
    user: eivoid
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: eivoid-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: BOT_API_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eivoid-db
          property: connectionString
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      # Used only by POST /api/v1/test/discord. It never reaches a browser.
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        value: "848841415940898827"
      - key: DISCORD_INVITE_PERMISSIONS
        value: "18432"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_REPO
        value: xyanncat/Ei-Void
      - key: GITHUB_TOKEN
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Ei Void
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: worker
    name: eivoid-bot
    runtime: docker
    dockerfilePath: ./Dockerfile.bot
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eivoid-db
          property: connectionString
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DISCORD_GUILD_ID
        value: "848841415940898827"
      - key: DISCORD_FALLBACK_CHANNEL_ID
        sync: false
      - key: BOT_HEALTH_PORT
        value: "8081"
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Ei Void
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
