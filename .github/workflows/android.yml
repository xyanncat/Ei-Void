name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public configuration, set as repository variables. Never secrets.
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
      EI_VOID_API_URL: ${{ vars.EI_VOID_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eivoid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
