name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Configure SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      # Without signing secrets the workflow still publishes an installable
      # developer-preview APK, named so nobody mistakes it for a signed build.
      - name: Build debug preview
        if: env.HAS_SIGNING != 'true'
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect release asset
        if: env.HAS_SIGNING == 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/EiVoid-${GITHUB_REF_NAME}.apk"

      - name: Collect preview asset
        if: env.HAS_SIGNING != 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/EiVoid-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
