name: Node

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "services/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "packages/**"
      - "services/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Docker smoke (web)
        run: docker build -f Dockerfile.web -t eivoid-web:ci .

      - name: Docker smoke (bot)
        run: docker build -f Dockerfile.bot -t eivoid-bot:ci .
