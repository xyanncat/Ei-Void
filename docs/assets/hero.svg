<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Void — an AI coding agent that lives on your phone">
  <title>Void</title>

  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0B12" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F7FB"/>
      <stop offset="58%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="ringC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5A5F" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FF5A5F" stop-opacity="0.03"/>
    </linearGradient>

    <path id="orbitA" d="M300,205 a300,72 0 1,0 600,0 a300,72 0 1,0 -600,0"/>
    <path id="orbitB" d="M360,205 a240,54 0 1,0 480,0 a240,54 0 1,0 -480,0"/>
    <path id="orbitC" d="M420,205 a180,38 0 1,0 360,0 a180,38 0 1,0 -360,0"/>
  </defs>

  <rect width="1200" height="340" fill="#0B0B12"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#F7F7FB">
    <circle cx="96"  cy="52"  r="1.6" opacity="0.5"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="188" cy="120" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.10;0.80;0.10" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="44"  r="1.8" opacity="0.6"><animate attributeName="opacity" values="0.20;1;0.20" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="92"  r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.12;0.75;0.12" dur="5.0s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="38"  r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.15;0.90;0.15" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="742" cy="46"  r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.15;0.90;0.15" dur="3.3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="846" cy="104" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.10;0.80;0.10" dur="4.6s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="944" cy="58"  r="1.7" opacity="0.6"><animate attributeName="opacity" values="0.20;1;0.20" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="1044" cy="126" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.12;0.70;0.12" dur="5.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1112" cy="66" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.9s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="64"  cy="286" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.10;0.75;0.10" dur="4.4s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="272" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.1s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbits -->
  <g fill="none" stroke-width="1.2">
    <ellipse cx="600" cy="205" rx="300" ry="72" stroke="url(#ringA)"/>
    <ellipse cx="600" cy="205" rx="240" ry="54" stroke="url(#ringB)"/>
    <ellipse cx="600" cy="205" rx="180" ry="38" stroke="url(#ringC)"/>
  </g>

  <!-- travelling bodies -->
  <g>
    <circle r="5" fill="#4F46E5">
      <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#orbitA" href="#orbitA"/>
      </animateMotion>
      <animate attributeName="r" values="4.2;5.6;4.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#F59E0B">
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#orbitB" href="#orbitB"/>
      </animateMotion>
      <animate attributeName="r" values="3.4;4.6;3.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#FF5A5F">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#orbitC" href="#orbitC"/>
      </animateMotion>
      <animate attributeName="r" values="2.8;3.8;2.8" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <text x="600" y="196" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="128" font-weight="800" letter-spacing="14" fill="url(#ink)">VOID</text>

  <text x="600" y="248" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="21" letter-spacing="6" fill="#9CA3AF">A CODING AGENT THAT LIVES ON YOUR PHONE</text>

  <text x="600" y="300" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="14" letter-spacing="3" fill="#4F46E5">RED DWARFS · WHITE DWARFS · NEUTRON STARS</text>
</svg>
